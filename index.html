<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey D Surebrec - Portal de Revendedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header / Bienvenida -->
    <header class="max-w-md mx-auto text-center space-y-2 mt-4">
        <h2 class="text-xs uppercase tracking-widest text-teal-400 font-bold">Bienvenido a la plataforma</h2>
        <h1 class="text-2xl md:text-3xl font-black bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">Monkey D Surebrec</h1>
        <p class="text-xs text-slate-400">Gracias por tu preferencia. Control exclusivo y seguro.</p>
    </header>

    <!-- Contenedor Principal de Acceso -->
    <main class="max-w-md w-full mx-auto my-auto bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl shadow-cyan-950/20">
        
        <!-- Pestañas de Navegación -->
        <div class="flex bg-black p-1 rounded-xl border border-zinc-800 mb-6 text-xs font-semibold">
            <button onclick="cambiarTab('login')" id="btn-login" class="w-1/2 py-2 rounded-lg bg-teal-500 text-black transition-all">Iniciar Sesión</button>
            <button onclick="cambiarTab('registro')" id="btn-registro" class="w-1/2 py-2 rounded-lg text-zinc-400 hover:text-white transition-all">Solicitar Registro</button>
        </div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="form-login" class="space-y-4" onsubmit="iniciarSesion(event)">
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">Correo Electrónico</label>
                <input type="email" id="login-correo" placeholder="tucorreo@dominio.com" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-400 transition-colors">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-400 transition-colors">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-400 hover:to-cyan-400 text-black font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-teal-950">Ingresar al Panel</button>
        </form>

        <!-- Formulario de Registro -->
        <form id="form-registro" class="space-y-4 hidden" onsubmit="registrarUsuario(event)">
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">Nombre de Usuario</label>
                <input type="text" id="reg-nombre" placeholder="Tu alias o nombre" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-teal-400">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">Correo Electrónico</label>
                <input type="email" id="reg-correo" placeholder="tucorreo@dominio.com" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-teal-400">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">WhatsApp / Teléfono</label>
                <input type="text" id="reg-whatsapp" placeholder="+52 ..." required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-teal-400">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase text-zinc-400 mb-1">Contraseña</label>
                <input type="password" id="reg-pass" placeholder="••••••••" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-teal-400">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-black font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-cyan-950">Enviar Solicitud de Acceso</button>
        </form>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-zinc-600 pb-2">
        Monkey D Surebrec © 2026 · Todos los derechos reservados.
    </footer>

    <!-- Conexión y Lógica con Supabase -->
    <script>
        const SUPABASE_URL = 'https://hlkuleummozpanmtwcxp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bzjhhVbFroDaKBWrKu48yA_uFkcfegJ';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function cambiarTab(tipo) {
            const fLogin = document.getElementById('form-login');
            const fRegistro = document.getElementById('form-registro');
            const bLogin = document.getElementById('btn-login');
            const bRegistro = document.getElementById('btn-registro');

            if (tipo === 'login') {
                fLogin.classList.remove('hidden');
                fRegistro.classList.add('hidden');
                bLogin.className = "w-1/2 py-2 rounded-lg bg-teal-500 text-black font-bold transition-all";
                bRegistro.className = "w-1/2 py-2 rounded-lg text-zinc-400 hover:text-white transition-all";
            } else {
                fLogin.classList.add('hidden');
                fRegistro.classList.remove('hidden');
                bRegistro.className = "w-1/2 py-2 rounded-lg bg-cyan-500 text-black font-bold transition-all";
                bLogin.className = "w-1/2 py-2 rounded-lg text-zinc-400 hover:text-white transition-all";
            }
        }

        // Registrar usuario en la base de datos con saldo en 0 y pendiente de aprobación
        async function registrarUsuario(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const correo = document.getElementById('reg-correo').value;
            const whatsapp = document.getElementById('reg-whatsapp').value;

            const { data, error } = await supabaseClient
                .from('usuarios')
                .insert([{ 
                    nombre, 
                    correo, 
                    whatsapp, 
                    rol: 'cliente', 
                    saldo: 0,
                    acceso_bot: false 
                }]);

            if (error) {
                alert('Error al registrarse: ' + error.message);
            } else {
                alert('¡Solicitud enviada con éxito! El administrador revisará tus datos.');
                document.getElementById('form-registro').reset();
                cambiarTab('login');
            }
        }

        // Iniciar sesión validando con Supabase la aprobación correcta
        async function iniciarSesion(e) {
            e.preventDefault();
            const correo = document.getElementById('login-correo').value.trim();

            // Acceso rápido de emergencia para administrador maestro
            if (correo === 'admin@surebrec.com') {
                window.location.href = 'admin.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .eq('correo', correo)
                .single();

            if (error || !data) {
                alert('Correo no registrado o no encontrado.');
                return;
            }

            // Validamos que la cuenta esté aprobada por el administrador (acceso_bot === true)
            if (data.acceso_bot !== true) {
                alert('Tu cuenta aún está pendiente de aprobación por el administrador.');
                return;
            }

            // Guardamos el correo en el almacenamiento local para la sesión
            localStorage.setItem('user_correo', correo);

            // Redirigir al panel de cliente
            window.location.href = 'cliente.html';
        }
    </script>
</body>
</html>
